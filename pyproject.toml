[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qstock"
version = "0.4.0"
description = "Stock price forecasts from price history with quantum amplitude estimation (Qiskit, IBM hardware)"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.3",
    "qiskit-aer>=0.15",
    "qiskit-algorithms>=0.3",
    "qiskit-finance>=0.4",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "yfinance>=0.2.40",
    "streamlit>=1.40",
    "plotly>=5.20",
    "qiskit-ibm-runtime>=0.40",
    "pytest",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
